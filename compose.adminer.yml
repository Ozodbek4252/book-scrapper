# Same project name as compose.prod.yaml on purpose: Compose (and Docker
# Desktop's grouping) then treats this as one more service in that stack
# rather than a separate project, and it lands on the same default network
# without needing an "external: true" cross-reference.
name: book-scraper-prod

# Ad hoc DB browser for the production stack: `docker compose -f
# compose.adminer.yml up -d`, then http://localhost:8080 (bound to
# localhost only — on a remote host, reach it via an SSH tunnel, same as
# the database itself; never bind this to a public interface).
services:
  adminer:
    image: adminer:5
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
