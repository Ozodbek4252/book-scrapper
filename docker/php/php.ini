; Settings shared by every environment.
[PHP]
expose_php = Off
memory_limit = 512M
max_execution_time = 120
max_input_time = 120
upload_max_filesize = 32M
post_max_size = 32M
date.timezone = UTC

; Log to the container output so `docker compose logs` shows PHP errors.
log_errors = On
error_log = /proc/self/fd/2

[Session]
session.cookie_httponly = On
session.use_strict_mode = On
