[www]
; Keep the container environment visible to PHP. Without this, php-fpm hides
; every variable passed by Docker and Laravel falls back to its defaults.
clear_env = no

; Send worker output to the container log instead of a file nobody reads.
catch_workers_output = yes
decorate_workers_output = no
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /proc/self/fd/2

; Endpoint used by the container healthcheck.
ping.path = /fpm-ping
pm.status_path = /fpm-status

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
