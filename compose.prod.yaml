name: book-scraper-prod

# Shared definition for every container that runs application PHP code.
# Values come from the shell or the .env file Compose reads automatically.
x-app: &app
  build:
    context: .
    target: production
  image: book-scraper:latest
  restart: unless-stopped
  environment: &app-env
    APP_ENV: production
    APP_DEBUG: "false"
    APP_KEY: ${APP_KEY:?APP_KEY must be set for the production stack}
    APP_URL: ${APP_URL:-http://localhost}
    LOG_CHANNEL: stderr
    LOG_LEVEL: ${LOG_LEVEL:-warning}
    # Keep the SQLite file on the persistent volume, not in the image.
    DB_CONNECTION: ${DB_CONNECTION:-sqlite}
    DB_DATABASE: ${DB_DATABASE:-/var/www/html/storage/database.sqlite}
    CACHE_STORE: database
    SESSION_DRIVER: database
    QUEUE_CONNECTION: database
  volumes:
    - storage:/var/www/html/storage

services:
  app:
    <<: *app
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"

  web:
    build:
      context: .
      target: web
    image: book-scraper-web:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      # Lets nginx serve anything published through `artisan storage:link`.
      - storage:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_healthy

  queue:
    <<: *app
    command: php artisan queue:work --tries=3 --max-time=3600 --sleep=1
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *app
    command: php artisan schedule:work
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

volumes:
  storage:
