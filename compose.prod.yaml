name: book-scraper-prod

# Shared definition for every container that runs application PHP code.
# Values come from the shell or the .env file Compose reads automatically.
# Built and pushed by .github/workflows/ci-cd.yml, not on the VPS: deploy
# does `docker compose pull` rather than `--build`. The `build:` section
# below stays for local testing on a machine that isn't memory-constrained.
x-app: &app
  build:
    context: .
    target: production
  image: ghcr.io/ozodbek4252/book-scraper:latest
  restart: unless-stopped
  environment: &app-env
    APP_ENV: production
    APP_DEBUG: "false"
    APP_KEY: ${APP_KEY:?APP_KEY must be set for the production stack}
    APP_URL: ${APP_URL:-http://localhost}
    LOG_CHANNEL: stderr
    LOG_LEVEL: ${LOG_LEVEL:-warning}
    # Point DB_HOST at an external server to drop the mysql service below.
    DB_CONNECTION: ${DB_CONNECTION:-mysql}
    DB_HOST: ${DB_HOST:-mysql}
    DB_PORT: ${DB_PORT:-3306}
    DB_DATABASE: ${DB_DATABASE:-book_scraper}
    DB_USERNAME: ${DB_USERNAME:-book_scraper}
    DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set for the production stack}
    SCOUT_DRIVER: ${SCOUT_DRIVER:-meilisearch}
    SCOUT_QUEUE: "true"
    MEILISEARCH_HOST: ${MEILISEARCH_HOST:-http://meilisearch:7700}
    MEILISEARCH_KEY: ${MEILISEARCH_KEY:?MEILISEARCH_KEY must be set for the production stack}
    CACHE_STORE: database
    SESSION_DRIVER: database
    QUEUE_CONNECTION: database
    # Must stay above the longest job's own timeout (DiscoverSourceJob's is
    # 1800s), or the queue thinks a still-running job was abandoned, retries
    # it, and it immediately exceeds that job's tries=1 with
    # MaxAttemptsExceededException — Laravel's own default here is 90s.
    DB_QUEUE_RETRY_AFTER: ${DB_QUEUE_RETRY_AFTER:-2000}
    SCRAPING_MAX_PAGES_PER_RUN: ${SCRAPING_MAX_PAGES_PER_RUN:-200}
    SCRAPING_ASAXIY_ENABLED: ${SCRAPING_ASAXIY_ENABLED:-false}
    SCRAPING_OLCHA_ENABLED: ${SCRAPING_OLCHA_ENABLED:-false}
  volumes:
    - storage:/var/www/html/storage
  depends_on:
    mysql:
      condition: service_healthy

services:
  app:
    <<: *app
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"

  web:
    build:
      context: .
      target: web
    image: ghcr.io/ozodbek4252/book-scraper-web:latest
    restart: unless-stopped
    volumes:
      # Lets nginx serve anything published through `artisan storage:link`.
      - storage:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_healthy

  # Internet-facing TLS termination. Gets and renews a Let's Encrypt
  # certificate for APP_DOMAIN automatically, then proxies to nginx.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
      - "${APP_TLS_PORT:-443}:443"
    environment:
      # Empty is the safe default for stacks with no public hostname to get
      # a certificate for — e.g. one only reached through a tunnel like
      # ngrok. Picks a plain-HTTP-only config instead (see entrypoint below).
      APP_DOMAIN: ${APP_DOMAIN:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -n "$$APP_DOMAIN" ]; then
          cp /etc/caddy/templates/Caddyfile.domain /etc/caddy/Caddyfile
        else
          cp /etc/caddy/templates/Caddyfile.plain /etc/caddy/Caddyfile
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./docker/caddy:/etc/caddy/templates:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

  mysql:
    # MariaDB, not MySQL: it's wire-compatible (Laravel's mysql driver works
    # unchanged) and, unlike mysql:8.x/percona, its glibc build still runs on
    # pre-x86-64-v2 hosts. Several budget VPS providers still expose CPUs
    # that old (missing SSE4.2/POPCNT), where mysql:8.x hard-crashes on boot.
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-book_scraper}
      MYSQL_USER: ${DB_USERNAME:-book_scraper}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set for the production stack}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set for the production stack}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:?MEILISEARCH_KEY must be set for the production stack}
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: production
    volumes:
      - meilisearch_data:/meili_data

  queue:
    <<: *app
    command: php artisan queue:work --queue=scraping-upserts,default,scraping --tries=3 --timeout=1800 --max-time=3600 --sleep=1
    healthcheck:
      disable: true
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_healthy

  scheduler:
    <<: *app
    command: php artisan schedule:work
    healthcheck:
      disable: true
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_healthy

volumes:
  meilisearch_data:
  mysql_data:
  storage:
  caddy_data:
  caddy_config:
